{% extends "base.html" %}
{% block title %}Reset password · {{ site_name }}{% endblock %}
{% block content %}
<header class="page-header"><div><p class="eyebrow">Account recovery</p><h1>Reset your password</h1><p>Enter the email address on your account and we’ll send a password-reset link.</p></div></header>
<div class="form-panel">
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Send reset link</button></form>
<p class="mt-3 mb-0"><a href="{% url 'login' %}">Back to log in</a></p>
</div>
{% endblock %}
